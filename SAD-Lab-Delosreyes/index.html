<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Record Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<style>
:root {
  --rose: #D63B6E;
  --rose-dark: #A32B57;
  --rose-deepest: #6B2140;
  --blush: #FDF3F6;
  --blush-line: #F0D8E1;
  --card: #FFFFFF;
  --text: #3D2A31;
  --muted: #9C7A83;
  --ok: #1E7B4D;
  --err: #B3261E;
  --radius: 16px;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: "Inter", "Segoe UI", Helvetica, Arial, sans-serif; background: var(--blush); color: var(--text); line-height: 1.5; }
.site-header {
  background:
    radial-gradient(circle at 85% -20%, rgba(255,255,255,0.18) 0%, transparent 45%),
    radial-gradient(circle at 10% 120%, rgba(255,255,255,0.12) 0%, transparent 40%),
    linear-gradient(135deg, var(--rose) 0%, var(--rose-dark) 100%);
  color: #fff; padding: 46px 20px 68px; text-align: center; position: relative; overflow: hidden;
}
.header-inner { display: inline-flex; align-items: center; gap: 14px; text-align: left; }
.brand-mark { width: 52px; height: 52px; flex-shrink: 0; border-radius: 14px; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.35); display: flex; align-items: center; justify-content: center; }
.site-header h1 { margin: 0 0 4px 0; font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 1.9rem; letter-spacing: 0.1px; }
.site-header .subtitle { margin: 0; color: #FBE3EC; font-size: 0.9rem; }
.container { max-width: 1040px; margin: -40px auto 0; padding: 0 20px 24px; display: grid; grid-template-columns: 350px 1fr; gap: 22px; align-items: start; position: relative; }
@media (max-width: 800px) { .container { grid-template-columns: 1fr; margin-top: -24px; } .header-inner { text-align: center; flex-direction: column; gap: 10px; } }
.panel { background: var(--card); border: 1px solid var(--blush-line); border-radius: var(--radius); padding: 24px; box-shadow: 0 14px 32px rgba(107,33,64,0.10); }
.panel h2 { margin-top: 0; font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 1.2rem; color: var(--rose-deepest); margin-bottom: 4px; }
.form-panel h2 { border-bottom: 1px solid var(--blush-line); padding-bottom: 14px; margin-bottom: 18px; }
.table-panel-head { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--blush-line); padding-bottom: 14px; margin-bottom: 6px; }
.record-count { font-size: 0.8rem; color: var(--muted); font-weight: 500; }
.field { margin-bottom: 15px; display: flex; flex-direction: column; }
.field label { font-size: 0.82rem; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
.field input, .field select { padding: 11px 12px; border: 1.5px solid var(--blush-line); border-radius: 9px; font-size: 0.95rem; font-family: inherit; background: #fff; color: var(--text); transition: border-color .15s ease; }
.field input:focus, .field select:focus { outline: none; border-color: var(--rose); box-shadow: 0 0 0 3px rgba(214,59,110,0.14); }
.field .program-other { margin-top: 8px; }
.field.has-error input, .field.has-error select { border-color: var(--err); }
.error-text { color: var(--err); font-size: 0.78rem; min-height: 16px; margin-top: 4px; }
.form-actions { display: flex; gap: 10px; margin-top: 10px; }
.btn { border: none; border-radius: 9px; padding: 12px 16px; font-size: 0.92rem; font-weight: 600; cursor: pointer; flex: 1; font-family: inherit; transition: background-color .15s ease, transform .1s ease; }
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--rose); color: #fff; box-shadow: 0 6px 16px rgba(214,59,110,0.32); }
.btn-primary:hover { background: var(--rose-dark); }
.btn-secondary { background: var(--blush); color: var(--rose-deepest); border: 1.5px solid var(--blush-line); }
.btn-secondary:hover { background: #F8E4EC; }
.btn-danger { background: transparent; color: var(--err); border: 1.5px solid #E9C2BF; padding: 6px 12px; font-size: 0.8rem; border-radius: 7px; cursor: pointer; font-family: inherit; }
.btn-danger:hover { background: #FBEAE9; }
.btn-edit { background: transparent; color: var(--rose-dark); border: 1.5px solid var(--rose); padding: 6px 12px; font-size: 0.8rem; border-radius: 7px; cursor: pointer; margin-right: 6px; font-family: inherit; }
.btn-edit:hover { background: var(--blush); }
.form-message { margin: 12px 0 0 0; font-size: 0.85rem; min-height: 18px; font-weight: 500; }
.form-message.success { color: var(--ok); }
.form-message.error { color: var(--err); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
thead th { text-align: left; padding: 12px 10px; border-bottom: 2px solid var(--blush-line); color: var(--rose-deepest); font-size: 0.76rem; font-weight: 700; white-space: nowrap; }
tbody td { padding: 13px 10px; border-bottom: 1px solid var(--blush-line); vertical-align: middle; }
tbody tr:hover { background: var(--blush); }
.student-cell { display: flex; align-items: center; gap: 10px; }
.avatar { width: 34px; height: 34px; flex-shrink: 0; border-radius: 50%; background: linear-gradient(135deg, var(--rose) 0%, var(--rose-dark) 100%); color: #fff; font-size: 0.72rem; font-weight: 700; display: flex; align-items: center; justify-content: center; letter-spacing: 0.3px; }
.student-cell-text { display: flex; flex-direction: column; min-width: 0; }
.student-name { font-weight: 600; color: var(--text); white-space: nowrap; }
.student-id { font-size: 0.76rem; color: var(--muted); }
.year-pill { display: inline-block; background: var(--blush); color: var(--rose-dark); border: 1px solid var(--blush-line); font-size: 0.76rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
.empty-row { text-align: center; padding: 36px 0; }
.empty-state { display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--muted); font-size: 0.88rem; }
.site-footer { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 26px 20px; }
</style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="30" height="30" fill="none">
          <path d="M24 6L4 16l20 10 20-10L24 6z" fill="#fff" opacity="0.95"/>
          <path d="M12 21v9c0 3.5 5.5 7 12 7s12-3.5 12-7v-9" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          <path d="M40 18v12" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <h1>Student Record Management System</h1>
        <p class="subtitle">CRUD Laboratory Activity — Systems Analysis and Design</p>
      </div>
    </div>
  </header>

  <main class="container">

    <section class="panel form-panel">
      <h2 id="form-title">Add Student</h2>
      <form id="student-form" novalidate>
        <input type="hidden" id="record-id" />

        <div class="field">
          <label for="student_id">Student ID</label>
          <input type="text" id="student_id" placeholder="e.g. M-001" />
          <span class="error-text" id="err-student_id"></span>
        </div>

        <div class="field">
          <label for="full_name">Full Name</label>
          <input type="text" id="full_name" placeholder="e.g. Juan Dela Cruz" />
          <span class="error-text" id="err-full_name"></span>
        </div>

        <div class="field">
          <label for="program">Program</label>
          <select id="program">
            <option value="">Select program</option>
            <option value="BS Information Technology">BS Information Technology</option>
            <option value="BS Computer Science">BS Computer Science</option>
            <option value="BS Information Systems">BS Information Systems</option>
            <option value="BS Computer Engineering">BS Computer Engineering</option>
            <option value="BS Software Engineering">BS Software Engineering</option>
            <option value="BS Accountancy">BS Accountancy</option>
            <option value="BS Business Administration">BS Business Administration</option>
            <option value="BS Education">BS Education</option>
            <option value="BS Nursing">BS Nursing</option>
            <option value="__other">Other (specify)</option>
          </select>
          <input type="text" id="program_other" class="program-other" placeholder="Type program name" hidden />
          <span class="error-text" id="err-program"></span>
        </div>

        <div class="field">
          <label for="year_level">Year Level</label>
          <select id="year_level">
            <option value="">Select year level</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
          <span class="error-text" id="err-year_level"></span>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="e.g. juan.delacruz@example.com" />
          <span class="error-text" id="err-email"></span>
        </div>

        <div class="form-actions">
          <button type="submit" id="save-btn" class="btn btn-primary">Save Student</button>
          <button type="button" id="cancel-btn" class="btn btn-secondary" hidden>Cancel Edit</button>
        </div>

        <p id="form-message" class="form-message" role="status"></p>
      </form>
    </section>

    <section class="panel table-panel">
      <div class="table-panel-head">
        <h2>Student Records</h2>
        <span class="record-count" id="record-count"></span>
      </div>
      <div class="table-wrap">
        <table id="student-table">
          <thead>
            <tr>
              <th>Student</th>
              <th>Program</th>
              <th>Year</th>
              <th>Email</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="student-table-body">
            <tr><td colspan="5" class="empty-row">Loading records…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p>Student Record Management System &middot; Supabase + Vanilla JS</p>
  </footer>

  <!-- Supabase client library (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
